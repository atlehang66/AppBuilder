<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Design Platform</title>
  <link rel="stylesheet" href="styles.css">
  <script src="js/sections.js" defer></script>
  <script src="js/iconEffect.js" defer></script>
  <script src="js/navIntergration.js" defer></script>
  <script src="js/templateSelectionContoller.js" defer></script>
  <script src="js/plusMenuController.js" defer></script>
</head>
<body>

  <header>
    <h1>Design Your Website</h1>
    <p>Select a theme and purpose, then explore templates</p>
    
    <div class="nav-icons">
  <a href="#themes" class="nav-icon" title="Themes">🎨</a>
  <a href="#purpose" class="nav-icon" title="Purpose">📝</a>
  <a href="#customize-sections" class="nav-icon" title="Templates">📦</a>
</div>

  </header>

  <div class="container">
    
    <!-- Theme Selection -->
    <div class="section" id="themes">
      <h2>Select Theme</h2>
      <div class="theme-options">
        <div class="color-palette" title="Modern">
          <div class="color-strip" style="background:#DCE1E3;"></div>
          <div class="color-strip" style="background:#A1A6AB;"></div>
          <div class="color-strip" style="background:#6D7175;"></div>
          <div class="color-strip" style="background:#393D40;"></div>
        </div>
        <div class="color-palette" title="Minimal">
          <div class="color-strip" style="background:#F8F8F8;"></div>
          <div class="color-strip" style="background:#E0E0E0;"></div>
          <div class="color-strip" style="background:#C0C0C0;"></div>
          <div class="color-strip" style="background:#A0A0A0;"></div>
        </div>
        <div class="color-palette" title="Warm">
          <div class="color-strip" style="background:#FFE9D6;"></div>
          <div class="color-strip" style="background:#FFD7B5;"></div>
          <div class="color-strip" style="background:#FFB88C;"></div>
          <div class="color-strip" style="background:#E9966D;"></div>
        </div>
        <div class="color-palette" title="Cool">
          <div class="color-strip" style="background:#E0F7FA;"></div>
          <div class="color-strip" style="background:#B2EBF2;"></div>
          <div class="color-strip" style="background:#80DEEA;"></div>
          <div class="color-strip" style="background:#4DD0E1;"></div>
        </div>
      </div>
    </div>

    <!-- Purpose Selection -->
    <div class="section" id="purpose">
      <h2>Select Purpose</h2>
      <select class="purpose-select">
          <option disabled selected>Select purpose...</option>
          <option value="portfolio">Portfolio</option>
          <option value="business">Business</option>
          <option value="blog">Blog</option>
          <option value="store">Online Store</option>
      </select>

    </div>

    
<section class="customize" id="customize-sections">
</section>

    </section>
    <!-- Plus Button with Dropdown -->
    <!-- Refined Plus Button with Dropdown -->
     <div class="plus-dropdown">
        <button id="plus-toggle" class="plus-btn" title="Add Section">+</button>
        <ul id="plus-menu" class="plus-menu">
          <li data-section="hero">➤ Hero Section</li>
          <li data-section="about">➤ About Us</li>
          <li data-section="services">➤ Services</li>
          <li data-section="portfolio">➤ Portfolio</li>
          <li data-section="testimonials">➤ Testimonials</li>
          <li data-section="pricing">➤ Pricing</li>
          <li data-section="contact">➤ Contact</li>
        </ul>
        
      </div>
    </div>

    <!-- Floating Contact Button -->
    <a href="mailto:atlehangsemela@gmail.com" class="floating-contact-btn" title="Contact a Designer">
      💬 Contact a Designer
    </a>
  </div>

</body>
</html>
