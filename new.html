<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Purpose Filter Test</title>
  <style>
    .plus-menu li { cursor: pointer; margin: 5px 0; }
  </style>
</head>
<body>

  <h2>Select Purpose</h2>
  <select class="purpose-select">
    <option disabled selected>Select purpose...</option>
    <option value="portfolio">Portfolio</option>
    <option value="business">Business</option>
    <option value="blog">Blog</option>
    <option value="store">Online Store</option>
  </select>

  <h2>Sections</h2>
  <ul id="plus-menu" class="plus-menu">
    <li>Select a purpose to see sections</li>
  </ul>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const purposeSelect = document.querySelector('.purpose-select');
      const plusMenu = document.getElementById('plus-menu');

      const purposeSectionsMap = {
        portfolio: ['hero', 'about', 'portfolio', 'testimonials', 'contact'],
        business: ['hero', 'services', 'about', 'pricing', 'contact'],
        blog: ['hero', 'blog', 'about', 'cta', 'contact'],
        store: ['hero', 'products', 'pricing', 'testimonials', 'contact']
      };

      const sectionNames = {
        hero: 'Hero Section',
        about: 'About Us',
        portfolio: 'Portfolio',
        testimonials: 'Testimonials',
        contact: 'Contact',
        services: 'Services',
        pricing: 'Pricing',
        blog: 'Blog',
        cta: 'Call To Action',
        products: 'Products/Gallery'
      };

      purposeSelect.addEventListener('change', () => {
        const selectedPurpose = purposeSelect.value;
        plusMenu.innerHTML = '';

        if (!selectedPurpose || !purposeSectionsMap[selectedPurpose]) {
          plusMenu.innerHTML = '<li>Invalid purpose</li>';
          return;
        }

        purposeSectionsMap[selectedPurpose].forEach(sectionKey => {
          const li = document.createElement('li');
          li.textContent = '➤ ' + sectionNames[sectionKey];
          li.dataset.section = sectionKey;
          plusMenu.appendChild(li);
        });
      });

      // Optional: listen to clicks
      plusMenu.addEventListener('click', e => {
        if (e.target.dataset.section) {
          alert(`Add section: ${e.target.dataset.section}`);
        }
      });
    });
  </script>

</body>
</html>
