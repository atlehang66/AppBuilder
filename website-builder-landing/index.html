<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website Builder Landing Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Title Section -->
  <h1>Build your own website</h1>

  <!-- First Carousel -->
  <div class="carousel">
    <img src="#" alt="Image 1">
    <img src="#" alt="Image 2">
    <img src="#" alt="Image 3">
  </div>

  <!-- Button -->
  <div class="button-section">
    <button class="main-button">Get Started</button>
  </div>

  <!-- Colour Palette -->
  <div class="color-palette">
    <div class="palette">
      <div class="swatch" style="background-color: #ffadad;"></div>
      <div class="swatch" style="background-color: #ff8787;"></div>
      <div class="swatch" style="background-color: #ff5e5e;"></div>
    </div>
    <div class="palette">
      <div class="swatch" style="background-color: #a0c4ff;"></div>
      <div class="swatch" style="background-color: #74a9ff;"></div>
      <div class="swatch" style="background-color: #4d91ff;"></div>
    </div>
    <div class="palette">
      <div class="swatch" style="background-color: #caffbf;"></div>
      <div class="swatch" style="background-color: #9bf6ff;"></div>
      <div class="swatch" style="background-color: #aaffc3;"></div>
    </div>
  </div>

  <!-- Second Carousel -->
  <div class="carousel">
    <img src="#" alt="Image 4">
    <img src="#" alt="Image 5">
    <img src="#" alt="Image 6">
  </div>

  <!-- Layout Section Title -->
  <h2>Select a layout</h2>

  <!-- Layout Options -->
  <div class="layout-options">
    <a href="#"><div class="layout-block"></div></a>
    <a href="#"><div class="layout-block"></div></a>
    <a href="#"><div class="layout-block"></div></a>
  </div>

  <!-- Contact Section -->
  <div class="contact-section">
    <div class="contact-column">Column 1 (Details later)</div>
    <div class="contact-column">Column 2 (Details later)</div>
    <div class="contact-column">Column 3 (Details later)</div>
  </div>

</body>
</html>
